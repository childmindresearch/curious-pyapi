[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "curious-pyapi"
dynamic = ["version"]
description = "Python interface for Curious API."
readme = "README.md"
authors = [
    { name = "Jon Cluce", email = "jon.clucas@childmind.org" }
]
requires-python = ">=3.14"
dependencies = [
    "fastexcel>=0.21.0",
    "httpx>=0.28.1",
    "polars>=1.44.0",
    "pydantic[email]>=2.13.4",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.pyright]
reportUnknownMemberType = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
extend-select = ["A", "B904", "C4", "D", "E", "EM", "F541", "G", "I", "ICN", "LOG007", "N", "NPY", "PL", "RET", "RSE", "RUF", "Q", "T20", "TRY002", "TRY201", "TRY400", "TRY401", "UP032", "W"]
ignore = ["D203", "D212", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
order-by-type = false
